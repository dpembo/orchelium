name: Build and Attest Release


on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to build'
        required: true
        default: main
        type: choice
        options:
          - main
          - develop
          - reconnect
          - patch-2
      other_branch:
        description: 'Another branch name. When filled, this is built instead of the selection above.'
        required: false
        type: string
      version:
        description: 'Version number for the Docker image (e.g., 2026.03.22.01) — leave blank for auto-versioning. Builds that are not from main get -rc added.'
        required: false
        type: string

# Add this permissions block
permissions:
  id-token: write
  contents: read
  attestations: write
  packages: write
  
jobs:
  build-and-attest:
    runs-on: ubuntu-latest


    steps:
      - name: Resolve branch
        id: branch
        env:
          SELECTED: ${{ inputs.branch }}
          OTHER: ${{ inputs.other_branch }}
        run: |
          set -euo pipefail
          branch="${OTHER:-$SELECTED}"
          branch="${branch#"${branch%%[![:space:]]*}"}"
          branch="${branch%"${branch##*[![:space:]]}"}"
          if [ -z "$branch" ]; then
            echo "Branch is required."
            exit 1
          fi
          if ! [[ "$branch" =~ ^[A-Za-z0-9._/-]+$ ]]; then
            echo "Branch name contains unsupported characters: $branch"
            exit 1
          fi
          echo "Building branch: $branch"
          echo "name=$branch" >> "$GITHUB_OUTPUT"
          if [ "$branch" = "main" ]; then
            echo "rc=false" >> "$GITHUB_OUTPUT"
          else
            echo "rc=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.branch.outputs.name }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '25'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            agent/package-lock.json

      - name: Set version (auto or manual)
        id: set_version
        env:
          MANUAL_VERSION: ${{ inputs.version }}
          RELEASE_CANDIDATE: ${{ steps.branch.outputs.rc }}
        run: |
          set -euo pipefail
          if [ -n "$MANUAL_VERSION" ]; then
            version="$MANUAL_VERSION"
            echo "Manual version input: $version"
          else
            echo "No manual version provided, attempting auto-versioning..."
            script="$(mktemp)"
            curl -fsSL \
              -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
              -H "Accept: application/vnd.github.raw" \
              "https://api.github.com/repos/${{ github.repository }}/contents/.github/workflows/_get-version.sh?ref=${{ github.sha }}" \
              -o "$script"
            chmod +x "$script"
            version=$("$script" "${{ secrets.GITHUB_TOKEN }}")
            if [ -z "$version" ]; then
              echo "Auto-versioning failed, please provide a version manually."
              exit 1
            fi
            echo "Auto-generated version: $version"
          fi
          if [ "$RELEASE_CANDIDATE" = "true" ]; then
            version="${version%-rc}-rc"
            echo "Branch is not main; release candidate version: $version"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Image tags
        id: image_tags
        env:
          VERSION: ${{ steps.set_version.outputs.version }}
          BRANCH: ${{ steps.branch.outputs.name }}
        run: |
          set -euo pipefail
          {
            echo "hub<<EOF"
            if [ "$BRANCH" = "main" ]; then
              echo "ghcr.io/dpembo/orchelium/hub:latest"
            fi
            echo "ghcr.io/dpembo/orchelium/hub:${VERSION}"
            echo "EOF"
            echo "agent<<EOF"
            if [ "$BRANCH" = "main" ]; then
              echo "ghcr.io/dpembo/orchelium/agent:latest"
            fi
            echo "ghcr.io/dpembo/orchelium/agent:${VERSION}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Reserve version tag
        shell: bash
        run: |
          set -euo pipefail

          tag="v${{ steps.set_version.outputs.version }}"
          repo="${{ github.repository }}"
          sha="$(git rev-parse HEAD)"

          echo "Reserving tag ${tag} on ${repo} at ${sha}"

          response_file="$(mktemp)"
          status_code="$(curl -sS -o "$response_file" -w "%{http_code}" \
            -X POST \
            -H "Authorization: token ${{ secrets.PAT_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${repo}/git/refs" \
            -d "{\"ref\":\"refs/tags/${tag}\",\"sha\":\"${sha}\"}")"

          if [ "$status_code" -eq 201 ]; then
            echo "Reserved tag ${tag}."
            exit 0
          fi

          echo "Failed to reserve tag ${tag} (HTTP ${status_code})."
          cat "$response_file"
          exit 1

      - name: Install server dependencies
        run: npm ci

      - name: Run server tests (with coverage)
        run: npm run test:coverage

      - name: Upload server coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: server-coverage
          path: coverage/

      - name: Install agent dependencies
        run: |
          cd agent
          npm ci --include=dev

      - name: Run agent tests (with coverage)
        run: |
          cd agent
          npm run test:coverage

      - name: Upload agent coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: agent-coverage
          path: agent/coverage/

      - name: Set version and create agent tar
        run: |
          replace_text() {
              local search_text="$1"
              local replacement_text="$2"
              local file_path="$3"

              # Check if the file exists
              if [ ! -f "$file_path" ]; then
                  echo "File $file_path does not exist."
                  exit 1
              fi

              # Perform the replacement
              sed -i "s/$search_text/$replacement_text/g" "$file_path"
          }

          version="${{ steps.set_version.outputs.version }}"
          if [ -z "$version" ]; then
              echo "Version is not provided."
              exit 1
          fi

          findText="var version=\"%%UNDEFINED%%\";"
          replText="var version=\"${version}\";"

          echo "Setting version number in hub and agent build"
          replace_text "$findText" "$replText" version.js
          replace_text "$findText" "$replText" ./agent/version.js

          if node -e "const p=require('./agent/package.json'); if(!p.scripts||!p.scripts.build) process.exit(1)"; then
            echo "Assemble standalone agent.js before packaging"
            npm --prefix agent run build
          else
            echo "This branch has no agent build script. Packaging the existing agent.js."
          fi
          test -f ./agent/agent.js

          echo "Create the agent tar for install from the web ux"
          tar -cvf ./public/agent/agent.tar \
            --exclude=src \
            --exclude=tests \
            --exclude=coverage \
            --exclude=node_modules \
            --exclude=build.js \
            --exclude=jest.config.js \
            -C ./agent .
          entries="$(tar -tf ./public/agent/agent.tar | sed 's|^\./||')"
          if echo "$entries" | grep -Eq '^(src|tests|coverage|node_modules)/'; then
            echo "agent.tar includes source, tests, coverage, or node_modules."
            exit 1
          fi
          if ! echo "$entries" | grep -qx 'agent.js'; then
            echo "agent.tar is missing the bundled agent.js."
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.PAT_TOKEN }}

      - name: GHCR auth preflight
        shell: bash
        run: |
          set -euo pipefail

          headers_file="$(mktemp)"
          status_code="$(curl -sS -D "$headers_file" -o /dev/null -w "%{http_code}" \
            -H "Authorization: token ${{ secrets.PAT_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/user)"

          if [ "$status_code" -ne 200 ]; then
            echo "GitHub token preflight failed: /user returned HTTP $status_code"
            exit 1
          fi

          scopes="$(tr -d '\r' < "$headers_file" | awk -F': ' 'tolower($1)=="x-oauth-scopes" {print $2}')"
          echo "Detected token scopes: ${scopes:-none}"

          # Fine-grained PATs may not return x-oauth-scopes; skip scope-gate in that case.
          if [ -z "${scopes:-}" ]; then
            echo "No x-oauth-scopes header returned (likely fine-grained PAT). Skipping scope check."
          elif ! echo "${scopes}" | grep -Eq '(^|, )write:packages(,|$)'; then
            echo "Token is missing write:packages scope, which is required to push ghcr.io images."
            exit 1
          fi

      - name: Build and push Orchelium/hub image
        id: build-and-push-hub
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.image_tags.outputs.hub }}
          labels: |
            org.opencontainers.image.title=dpembo/orchelium/hub
            org.opencontainers.image.version=${{ steps.set_version.outputs.version }}
            org.opencontainers.image.source=https://github.com/dpembo/orchelium

      - name: Attest build provenance for Orchelium/hub
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ghcr.io/dpembo/orchelium/hub
          subject-digest: ${{ steps.build-and-push-hub.outputs.digest }}
          push-to-registry: true
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Orchelium/agent image
        id: build-and-push-agent
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./agent/Dockerfile
          push: true
          tags: ${{ steps.image_tags.outputs.agent }}
          labels: |
            org.opencontainers.image.title=dpembo/orchelium/agent
            org.opencontainers.image.version=${{ steps.set_version.outputs.version }}
            org.opencontainers.image.source=https://github.com/dpembo/orchelium

      - name: Attest build provenance for orchelium/agent
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ghcr.io/dpembo/orchelium/agent
          subject-digest: ${{ steps.build-and-push-agent.outputs.digest }}
          push-to-registry: true
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Git Release
        shell: bash
        run: |
          release_title="Orchelium [v${{ steps.set_version.outputs.version }}]"
          if [ "${{ steps.branch.outputs.rc }}" = "true" ]; then
            release_title="${release_title} release candidate"
          fi
          ./gitRelease.sh ${{ github.repository_owner }} ${{ github.event.repository.name }} ${{ steps.branch.outputs.name }} ${{ secrets.PAT_TOKEN }} "v${{ steps.set_version.outputs.version }}" "v${{ steps.set_version.outputs.version }}" "$release_title"


